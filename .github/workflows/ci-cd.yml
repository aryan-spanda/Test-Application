  # Job 4: Build and push Docker images for each microservice
  build:
    needs: [ config, discover ]
    # Uncomment the line below if you enable the test job
    # needs: [config, discover, test]
    runs-on: ubuntu-latest
    if: needs.discover.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
    - name: Debug matrix configuration
      run: |
        echo "Service Name: ${{ matrix.service.name }}"
        echo "Dockerfile: ${{ matrix.service.dockerfile }}"
        echo "Context: ${{ matrix.service.context }}"
        echo "Current Branch: ${{ github.ref_name }}"
        echo "Git SHA: ${{ github.sha }}"
        echo "Full Expected Tags:"
        echo "  - ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}"
        echo "  - ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-latest"
        echo "Services JSON: ${{ needs.discover.outputs.services }}"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Debug registry configuration
      run: |
        echo "Registry host: ${{ needs.config.outputs.registry_host }}"
        echo "Image namespace: ${{ needs.config.outputs.image_namespace }}"
        echo "Image name: ${{ needs.config.outputs.image_name }}"
        echo "Image repository: ${{ needs.config.outputs.image_repository }}"
        echo "Full repository: ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}"
        echo "Username secret name: ${{ needs.config.outputs.registry_username_secret }}"
        echo "Password secret name: ${{ needs.config.outputs.registry_password_secret }}"

    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ needs.config.outputs.registry_host }}
        username: ${{ secrets[needs.config.outputs.registry_username_secret] }}
        password: ${{ secrets[needs.config.outputs.registry_password_secret] }}

    - name: Verify Docker login
      run: |
        echo "Testing Docker Hub connection..."
        docker info
        docker version

    - name: Debug build context
      run: |
        echo "Application: ${{ needs.config.outputs.app_name }}"
        echo "Registry Host: ${{ needs.config.outputs.registry_host }}"
        echo "Image Repository: ${{ needs.config.outputs.image_repository }}"
        echo "Service Name: ${{ matrix.service.name }}"
        echo "Branch Name: ${{ github.ref_name }}"
        echo "SHA: ${{ github.sha }}"
        echo "Full image tag with SHA: ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}"
        echo "Full image tag latest: ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-latest"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: |
          ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}
          ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-latest
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.updated_at }}
        cache-from: type=gha,scope=${{ matrix.service.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
        platforms: linux/amd64
        outputs: type=registry

    - name: Debug build outputs
      run: |
        echo "Build completed for application: ${{ needs.config.outputs.app_name }}"
        echo "Service: ${{ matrix.service.name }}"
        echo "Expected image: ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}"
        echo "Service-specific tags: ${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}, ${{ matrix.service.name }}-${{ github.ref_name }}-latest"

    - name: Output image details
      run: |
        echo "Built and pushed image for service: ${{ matrix.service.name }}"
        echo "Image tags: ${{ steps.meta.outputs.tags }}"
        echo "Image digest: ${{ steps.meta.outputs.digest }}"

  # Job 5: Security scanning
  security:
    needs: [ config, discover, build ]
    runs-on: ubuntu-latest
    if: needs.discover.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Wait for image to be available
      run: |
        echo "Waiting 30 seconds for image to be available on DockerHub..."
        sleep 30

    - name: Verify image exists before scanning
      id: check-image
      continue-on-error: true
      run: |
        image_name="${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}"
        echo "Checking if image exists: $image_name"

        # Try to pull the image manifest to verify it exists
        if docker manifest inspect "$image_name" > /dev/null 2>&1; then
          echo "image_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Image found: $image_name"
        else
          echo "image_exists=false" >> $GITHUB_OUTPUT
          echo "❌ Image not found: $image_name"
        fi

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      if: steps.check-image.outputs.image_exists == 'true'
      continue-on-error: true
      with:
        image-ref: ${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service.name }}.sarif'
        timeout: '10m' # Increase timeout to 10 minutes
        scanners: 'vuln' # Only scan for vulnerabilities, skip secrets to speed up

    - name: Fallback Quick Trivy scan
      if: ${{ steps.check-image.outputs.image_exists == 'true' && failure() }}
      continue-on-error: true
      run: |
        echo "Full scan failed, attempting quick vulnerability-only scan..."
        IMAGE_NAME="${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}:${{ matrix.service.name }}-${{ github.ref_name }}-${{ github.sha }}"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --timeout 5m --scanners vuln --severity HIGH,CRITICAL "$IMAGE_NAME" || echo "Quick scan also failed"

    - name: Check if SARIF file was created
      id: check-sarif
      run: |
        if [ -f "trivy-results-${{ matrix.service.name }}.sarif" ]; then
          echo "sarif_exists=true" >> $GITHUB_OUTPUT
          echo "✅ SARIF file created successfully"
        else
          echo "sarif_exists=false" >> $GITHUB_OUTPUT
          echo "❌ SARIF file not found (scan may have failed or timed out)"
        fi

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check-sarif.outputs.sarif_exists == 'true'
      with:
        sarif_file: 'trivy-results-${{ matrix.service.name }}.sarif'

  # Job 6: Update Helm values for ArgoCD Image Updater (Testing Branch Integration)
  update-helm-values:
    needs: [ config, discover, build, security ]
    runs-on: ubuntu-latest
    if: needs.config.outputs.should_deploy == 'true' && github.ref_name == 'testing'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install yq
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Update Helm values for testing environment
      run: |
        echo "🔄 Updating Helm values for testing branch deployment..."

        # Check if Helm values file exists
        HELM_VALUES_FILE="deploy/helm/values-dev.yaml"
        if [[ ! -f "$HELM_VALUES_FILE" ]]; then
          echo "Creating $HELM_VALUES_FILE..."
          mkdir -p deploy/helm
          echo "# Auto-generated values for testing branch" > "$HELM_VALUES_FILE"
        fi

        # Update image tags for each discovered service
        echo '${{ needs.discover.outputs.services }}' | jq -r '.[].name' | while read service; do
          echo "Updating $service image tag..."
          
          # Create the image tag for testing branch
          image_tag="${service}-testing-${{ github.sha }}"
          image_repo="${{ needs.config.outputs.registry_host }}/${{ needs.config.outputs.image_repository }}"
          
          # Update or add the service configuration in Helm values
          yq e ".${service}.image.repository = \"$image_repo\"" -i "$HELM_VALUES_FILE"
          yq e ".${service}.image.tag = \"$image_tag\"" -i "$HELM_VALUES_FILE"
          
          echo "Updated $service -> $image_repo:$image_tag"
        done

    - name: Commit updated Helm values
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        if git diff --quiet deploy/helm/values-dev.yaml; then
          echo "No changes to commit"
        else
          git add deploy/helm/values-dev.yaml
          git commit -m "build: update image tags for testing branch - ${{ github.sha }}"
          git push
          echo "✅ Committed updated Helm values for testing branch"
        fi

  # NOTE: ArgoCD Image Updater will also handle deployment automation
  # Images are built and pushed to Docker registry, ArgoCD Image Updater will:
  # 1. Detect new SHA-based image tags for testing branch
  # 2. Update Helm values automatically
  # 3. Commit changes to repository
  # 4. Trigger ArgoCD sync

  # Job 7: Notification and summary
  notify:
    needs: [ config, discover, build, security, update-helm-values ]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Build Summary
      run: |
        echo "## 🤖 Educational Chatbot CI/CD Summary (Testing Branch)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### ✅ Build & Push Status" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }} (Testing Branch Optimized)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Images**: Built and pushed to Docker registry" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment**: ArgoCD Image Updater will auto-detect and deploy" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ needs.config.outputs.target_environment }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔨 Built Services" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.discover.outputs.services }}" != "[]" ]; then
          echo '${{ needs.discover.outputs.services }}' | jq -r '.[] | "- **" + .name + "** (from `" + .dockerfile + "`)"' >> $GITHUB_STEP_SUMMARY
        else
          echo "No services found to build." >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- **Config**: ${{ needs.config.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Discovery**: ${{ needs.discover.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Helm Update**: ${{ needs.update-helm-values.result }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Testing Branch Features" >> $GITHUB_STEP_SUMMARY
        echo "- **SHA-based tags**: Images tagged with \`service-testing-sha\` format" >> $GITHUB_STEP_SUMMARY
        echo "- **Auto Helm update**: Values files updated automatically for testing branch" >> $GITHUB_STEP_SUMMARY
        echo "- **ArgoCD Integration**: Optimized for ArgoCD Image Updater detection" >> $GITHUB_STEP_SUMMARY
        echo "- **Security scanning**: Trivy vulnerability scanning included" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
